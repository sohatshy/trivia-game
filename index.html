<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ميدان — لعبة أسئلة للفريقين</title>
  <meta name="description" content="لعبة أسئلة عربية لفريقين على شاشة واحدة">
  <meta name="theme-color" content="#16181b">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ========== LOGIN ========== -->
  <main id="screen-login" class="screen" hidden aria-labelledby="login-title">
    <h1 id="login-title" class="logo login-logo"><span data-icon="logo"></span><span class="logo-word" data-game-name translate="no">ميدان</span></h1>
    <p class="login-tagline">فريقان، ستّ فئات، وشاشة واحدة.</p>
    <div class="login-actions">
      <button type="button" class="btn btn-big btn-google" id="btn-google"><span data-icon="google"></span>الدخول بحساب Google</button>
      <p class="login-user" id="login-user" hidden></p>
      <button type="button" class="btn btn-big btn-ghost" id="btn-guest">العب كضيف</button>
      <button type="button" class="btn btn-ghost btn-small" id="btn-signout" hidden>تسجيل الخروج</button>
      <p class="login-note" id="login-note" role="status" aria-live="polite"></p>
    </div>
  </main>

  <!-- ========== SETUP: category draft ========== -->
  <main id="screen-setup" class="screen" hidden aria-labelledby="setup-title">
    <header class="draft-head">
      <span class="logo"><span data-icon="logo"></span><span class="logo-word" data-game-name translate="no">ميدان</span></span>
      <h1 id="setup-title">اختيار الفئات</h1>
    </header>
    <form id="setup-form" class="draft" novalidate>
      <div class="draft-top">
        <label class="team-field" data-team="0">
          <span class="team-field-label"><span class="team-mark" aria-hidden="true"></span>الفريق الأول</span>
          <input id="t0-name" name="team0" autocomplete="off" spellcheck="false" maxlength="24" placeholder="اكتبوا اسم فريقكم…">
        </label>
        <div class="draft-turn">
          <p class="draft-turn-text" id="draft-turn-text" aria-live="polite"></p>
          <ol class="draft-order" id="draft-order" aria-label="ترتيب الاختيار"></ol>
        </div>
        <label class="team-field" data-team="1">
          <span class="team-field-label"><span class="team-mark" aria-hidden="true"></span>الفريق الثاني</span>
          <input id="t1-name" name="team1" autocomplete="off" spellcheck="false" maxlength="24" placeholder="اكتبوا اسم فريقكم…">
        </label>
      </div>

      <div class="draft-body">
        <section class="draft-side" data-team="0" aria-labelledby="side0-title">
          <h2 class="visually-hidden" id="side0-title">فئات الفريق الأول</h2>
          <ol class="slots" id="slots-0"></ol>
        </section>

        <section class="draft-pool" aria-labelledby="pool-title">
          <h2 class="visually-hidden" id="pool-title">الفئات المتاحة</h2>
          <div class="pool-tools">
            <label class="pool-search">
              <span class="visually-hidden">ابحث عن فئة</span>
              <input type="search" id="pool-search" placeholder="ابحث عن فئة…" autocomplete="off" spellcheck="false">
            </label>
            <div class="chips" id="pool-filters" role="group" aria-label="تصفية الفئات"></div>
          </div>
          <div class="pool-grid" id="pool"></div>
          <p class="pool-empty" id="pool-empty" hidden></p>
        </section>

        <section class="draft-side" data-team="1" aria-labelledby="side1-title">
          <h2 class="visually-hidden" id="side1-title">فئات الفريق الثاني</h2>
          <ol class="slots" id="slots-1"></ol>
        </section>
      </div>

      <div class="draft-foot">
        <p class="setup-error" id="setup-error" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-big" id="btn-start" aria-describedby="start-hint" disabled>ابدأ اللعب</button>
        <p class="start-hint" id="start-hint"></p>
      </div>
    </form>
  </main>

  <!-- ========== BOARD ========== -->
  <main id="screen-board" class="screen" hidden aria-label="لوحة الأسئلة">
    <header class="scorebar">
      <div class="team-card" data-team="0"></div>
      <div class="turn-indicator" id="turn-indicator" aria-live="polite"></div>
      <div class="team-card" data-team="1"></div>
    </header>
    <div class="board" id="board"></div>
  </main>

  <!-- ========== QUESTION ========== -->
  <main id="screen-question" class="screen" hidden aria-labelledby="q-text">
    <div class="q-top">
      <span class="q-tag"><span id="q-cat"></span><span class="q-points" id="q-points"></span><span class="q-bet" id="q-bet" hidden>رهان ×2</span></span>
      <div class="q-helpers" id="q-helpers" role="group" aria-label="المساعدات"></div>
      <span class="q-who" id="q-who" aria-live="polite"></span>
    </div>
    <div class="q-main">
      <div class="q-body">
        <h1 class="q-text" id="q-text"></h1>
        <p class="q-glimpse" id="q-glimpse" hidden></p>
        <img class="q-flag" id="q-flag" alt="علم الدولة المطلوبة" width="520" height="390" hidden>
        <div class="q-media" id="q-media" hidden></div>
        <div class="q-answer" id="q-answer" hidden aria-live="polite"></div>
      </div>
      <div class="timer" id="timer" role="timer" aria-label="الوقت المتبقي">
        <svg viewBox="-10 -10 220 220" aria-hidden="true"><polygon class="track"/><polygon class="fill" pathLength="100" stroke-dasharray="100"/></svg>
        <span class="num" id="timer-num">60</span>
      </div>
    </div>
    <div class="q-actions" id="q-actions"></div>
  </main>

  <!-- ========== WINNER ========== -->
  <main id="screen-winner" class="screen" hidden aria-labelledby="win-name">
    <canvas id="confetti" aria-hidden="true"></canvas>
    <p class="win-kicker" id="win-kicker">الفائز</p>
    <h1 class="win-name" id="win-name"></h1>
    <div class="win-scores" id="win-scores"></div>
    <button type="button" class="btn btn-big btn-t1" id="btn-new">لعبة جديدة</button>
  </main>

  <footer class="site-footer" id="site-footer" hidden>
    <p lang="en" dir="ltr">© 2026 Sohatshy. All rights reserved.</p>
  </footer>

  <div class="corner-tools">
    <button type="button" class="icon-btn" id="btn-mute" aria-label="كتم الصوت" aria-pressed="false"></button>
    <button type="button" class="icon-btn" id="btn-quit" aria-label="إنهاء اللعبة والعودة للبداية" hidden></button>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
