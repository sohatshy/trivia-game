<!doctype html>
<meta charset="utf-8">
<title>Setup preview</title>
<!-- Test helper: opens the real game in a frame, goes to the category draft, types team names,
     makes a few picks (?picks=geo,flags,rivals in pick order) and optionally opens one "i" description
     (?info=math), so the draft can be screenshotted at any size. -->
<style>html,body,iframe{margin:0;border:0;width:100%;height:100%;display:block}</style>
<iframe id="f" src="load-state.html?state=none"></iframe>
<script>
  const p = new URLSearchParams(location.search);
  const f = document.getElementById('f');
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  f.addEventListener('load', async () => {
    if (!f.contentWindow.location.pathname.endsWith('index.html') && f.contentWindow.location.pathname !== '/') return;
    await wait(800);
    const d = f.contentDocument;
    d.querySelector('#btn-guest').click();
    d.querySelector('#t0-name').value = p.get('t0') ?? 'الصقور';
    d.querySelector('#t1-name').value = p.get('t1') ?? 'النجوم';
    d.querySelector('#t0-name').dispatchEvent(new Event('input', { bubbles: true }));
    for (const id of (p.get('picks') ?? 'geo,flags,rivals').split(',').filter(Boolean)) {
      d.querySelector(`#pool .cat-pick[data-cat="${id}"]`)?.click();
      await wait(80);
    }
    if (p.get('info')) d.querySelector(`#pool .cat-card[data-cat="${p.get('info')}"] .cat-info`)?.click();
  });
</script>
